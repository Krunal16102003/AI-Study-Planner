<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="AI-powered career and study planning workspace for skill roadmaps, schedules, revision, focus, readiness scoring, and interview preparation." />
    <meta name="application-name" content="AI Study Planner" />
    <meta name="apple-mobile-web-app-title" content="AI Study Planner" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor" content="#07111f" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Study Planner" />
    <meta property="og:title" content="AI Study Planner | Career & Skill Roadmap OS" />
    <meta property="og:description" content="A premium AI-powered workspace for career roadmaps, skill analytics, study planning, and interview readiness." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AI Study Planner | Career & Skill Roadmap OS" />
    <meta name="twitter:description" content="AI career planning, skill gaps, projects, readiness scoring, and study workflows in one modern SaaS dashboard." />
    <meta name="twitter:image" content="/icon-512.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AI Study Planner | Career & Skill Roadmap OS</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:#f4f7f5;color:#172026;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px;">
        <section>
          <div style="width:48px;height:48px;margin:0 auto 18px;border:4px solid #dbe8e2;border-top-color:#226f54;border-radius:50%;animation:spin 900ms linear infinite;"></div>
          <h1 style="margin:0 0 10px;font-size:34px;">AI Study Planner</h1>
          <p style="margin:0;color:#637069;">Starting the study workspace...</p>
        </section>
      </main>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("theme") || "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
