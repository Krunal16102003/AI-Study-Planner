<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#226f54" />
    <meta name="description" content="AI-powered study planner for schedules, revision, focus, quizzes, and exam readiness." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AI Study Planner" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>AI Study Planner</title>
    <script type="module" crossorigin src="/assets/index-pkY7py94.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DrJWYneO.css">
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:#f4f7f5;color:#172026;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px;">
        <section>
          <div style="width:48px;height:48px;margin:0 auto 18px;border:4px solid #dbe8e2;border-top-color:#226f54;border-radius:50%;animation:spin 900ms linear infinite;"></div>
          <h1 style="margin:0 0 10px;font-size:34px;">AI Study Planner</h1>
          <p style="margin:0;color:#637069;">Starting the study workspace...</p>
        </section>
      </main>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("theme") || "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </body>
</html>
