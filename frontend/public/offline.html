<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#226f54" />
    <title>AI Study Planner Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #111827;
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 420px;
        padding: 28px;
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      img { width: 64px; height: 64px; }
      h1 { margin: 18px 0 8px; font-size: 26px; }
      p { color: #6b7280; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>You are offline</h1>
      <p>Recent app screens and assets are cached. Reconnect to sync AI, planner, and notification updates.</p>
    </main>
  </body>
</html>
